[project]
name = "fairhaven_tax"
version = "0.1.0"
description = "Fair Haven Tax Assessment Analysis — Berry tax-shift + IAAO CDF gap test pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "geopandas>=1.0",
  "pyarrow>=17.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fiona>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "requests>=2.32",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "structlog>=24.1",
]

[project.scripts]
fairhaven-tax = "fairhaven_tax.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairhaven_tax"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
